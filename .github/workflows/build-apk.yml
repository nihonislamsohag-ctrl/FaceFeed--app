name: Build FotoFilm APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Restore Debug Keystore & Env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare FotoFilm APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FotoFilm.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FotoFilm-APK
          path: FotoFilm.apk

      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: latest
          name: "FotoFilm App Release (116 MB)"
          body: "আপনার নতুন FotoFilm অ্যান্ড্রয়েড অ্যাপের রেডি APK ফাইল (প্রায় ১১৬ MB)। নিচে Assets থেকে FotoFilm.apk ডাউনলোড করে ফোনে ইনস্টল করে নিন।"
          files: FotoFilm.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
