name: Build FotoFilm APK & AAB

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK & Auto-Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR/licenses"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-license"
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-preview-license"
          84831b9409646a918e30573bab4c9c91346d8abd
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/android-googletv-license"
          601085b94cd77f0b54ff86406957099ebe79c4d6
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/android-googlexr-license"
          ceff83576aac4f7f37cb98fe189e9fb3c49d3b81
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-arm-dbt-license"
          859f317696f67ef3d7f30a50a5560e7834b43903
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/google-gdk-license"
          33b6a2b64607f11b759f320ef9dff4ae5c47d97a
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/microxr-sysimage-license"
          3a7848b1d7366ca5cfa0be477627644ca73f47e3
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/mips-android-sysimage-license"
          e9acab5b5fbb560a72cfaecce8946896ff6aab9d
          EOF

          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER" || true
            set +o pipefail
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi

      - name: Restore Debug Keystore & Env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          touch .env
          set_env_var() {
            KEY="$1"
            VAL="$2"
            if [ -n "$VAL" ]; then
              grep -v "^${KEY}=" .env > .env.tmp || true
              mv .env.tmp .env
              printf '%s=%s\n' "$KEY" "$VAL" >> .env
            fi
          }
          set_env_var "GEMINI_API_KEY" "${GEMINI_API_KEY:-}"
          set_env_var "CLOUDINARY_CLOUD_NAME" "${CLOUDINARY_CLOUD_NAME:-}"
          set_env_var "CLOUDINARY_UPLOAD_PRESET" "${CLOUDINARY_UPLOAD_PRESET:-}"
          set_env_var "AGORA_APP_ID" "${AGORA_APP_ID:-}"
          if [ ! -f app/google-services.json ] && [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK & AAB
        run: |
          set +e
          ./gradlew assembleDebug bundleDebug --no-daemon --no-configuration-cache --no-parallel --max-workers=1 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "================ REAL GRADLE ERROR ================"
            if grep -q "FAILURE: Build failed" build.log; then
              grep -A 25 "FAILURE: Build failed" build.log | head -n 30
            else
              tail -n 30 build.log
            fi
            exit "$BUILD_EXIT"
          fi

      - name: Build Play Store Signed Release AAB (if Upload Keystore configured)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${UPLOAD_KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            ./gradlew bundleRelease --no-daemon --no-configuration-cache --no-parallel --max-workers=1 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" 2>&1 | tee release-build.log
          else
            echo "Upload keystore secrets not configured; skipping Play Store release signing."
          fi

      - name: Prepare FotoFilm APK & AAB
        id: prep_assets
        run: |
          mkdir -p release-assets
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/debug/app-debug.aab
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/FotoFilm.apk
          cp app/build/outputs/bundle/debug/app-debug.aab release-assets/FotoFilm.aab
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab release-assets/FotoFilm-PlayStore-Signed.aab
            SIGNED_STATUS="ready"
          else
            SIGNED_STATUS="not_configured"
          fi
          APK_BYTES=$(stat -c%s release-assets/FotoFilm.apk)
          AAB_BYTES=$(stat -c%s release-assets/FotoFilm.aab)
          APK_MB=$(awk "BEGIN {printf \"%.1f\", $APK_BYTES/1000000}")
          AAB_MB=$(awk "BEGIN {printf \"%.1f\", $AAB_BYTES/1000000}")
          echo "apk_mb=$APK_MB" >> "$GITHUB_OUTPUT"
          echo "aab_mb=$AAB_MB" >> "$GITHUB_OUTPUT"
          echo "signed_status=$SIGNED_STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FotoFilm-APK-and-AAB
          path: release-assets/*
          retention-days: 30

      - name: Refresh latest tag & release timestamp
        continue-on-error: true
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push origin refs/tags/latest --force

      - name: Create or Update Latest Release
        id: publish_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: latest
          name: "FotoFilm v2.0 App Release (APK ${{ steps.prep_assets.outputs.apk_mb }} MB • AAB ${{ steps.prep_assets.outputs.aab_mb }} MB)"
          body: "আপনার নতুন FotoFilm v2.0 অ্যান্ড্রয়েড অ্যাপের সর্বশেষ আপডেটেড APK ফাইল (~${{ steps.prep_assets.outputs.apk_mb }} MB) এবং AAB ফাইল (~${{ steps.prep_assets.outputs.aab_mb }} MB)। নিচে Assets থেকে FotoFilm.apk অথবা FotoFilm.aab ডাউনলোড করে নিন। (বিঃদ্রঃ ফোনে আগে পুরানো v1.0 ইনস্টল করা থাকলে 'App not installed' এড়াতে সেটি একবার Uninstall করে নতুন v2.0 ইনস্টল করুন।)"
          files: release-assets/*
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          {
            echo "## FotoFilm APK & AAB Build Summary"
            if [ -f release-assets/FotoFilm.apk ]; then
              echo "- APK Status: **Ready** (${{ steps.prep_assets.outputs.apk_mb }} MB / $(du -h release-assets/FotoFilm.apk | cut -f1))"
              echo "- AAB Status: **Ready** (${{ steps.prep_assets.outputs.aab_mb }} MB / $(du -h release-assets/FotoFilm.aab | cut -f1))"
              if [ -f release-assets/FotoFilm-PlayStore-Signed.aab ]; then
                echo "- Play Store Signed Release AAB: **Ready** ($(du -h release-assets/FotoFilm-PlayStore-Signed.aab | cut -f1))"
              else
                echo "- Play Store Signed Release AAB: **Not Configured** (Add \`UPLOAD_KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, and \`KEY_PASSWORD\` in GitHub Repo -> Settings -> Secrets and variables -> Actions to auto-sign for Play Store)"
              fi
              echo "- Download from **Artifacts -> FotoFilm-APK-and-AAB** or **Releases -> latest -> Assets**."
            else
              echo "- Build Status: **Failed**"
              if [ -f build.log ]; then
                echo ""
                echo "### Error Details"
                echo '```text'
                if grep -q "FAILURE: Build failed" build.log; then
                  grep -A 25 "FAILURE: Build failed" build.log | head -n 30
                else
                  tail -n 30 build.log
                fi
                echo '```'
              fi
            fi
            if [ -n "${CLOUDINARY_CLOUD_NAME:-}" ] && [ -n "${CLOUDINARY_UPLOAD_PRESET:-}" ]; then
              echo "- Cloudinary Media Cloud: **Configured from GitHub Secrets**"
            else
              echo "- Cloudinary Media Cloud: **Missing in GitHub Secrets** (Add \`CLOUDINARY_CLOUD_NAME\` & \`CLOUDINARY_UPLOAD_PRESET\` in GitHub Repo -> Settings -> Secrets and variables -> Actions)"
            fi
            if [ -n "${AGORA_APP_ID:-}" ]; then
              echo "- Agora Audio/Video Calling: **Configured from GitHub Secrets**"
            else
              echo "- Agora Audio/Video Calling: **Missing in GitHub Secrets** (Add \`AGORA_APP_ID\` in GitHub Repo -> Settings -> Secrets and variables -> Actions)"
            fi
            if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
              echo "- GitHub Release: **Published** under Releases -> latest"
            elif [ "${{ steps.publish_release.outcome }}" = "failure" ]; then
              echo "- GitHub Release: **Permission blocked** (Enable Settings -> Actions -> General -> Workflow permissions -> Read and write permissions). You can still download the APK & AAB from Artifacts below."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
