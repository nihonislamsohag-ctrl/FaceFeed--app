name: Build FotoFilm APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK & Auto-Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR/licenses"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-license"
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-preview-license"
          84831b9409646a918e30573bab4c9c91346d8abd
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/android-googletv-license"
          601085b94cd77f0b54ff86406957099ebe79c4d6
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/android-googlexr-license"
          ceff83576aac4f7f37cb98fe189e9fb3c49d3b81
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/android-sdk-arm-dbt-license"
          859f317696f67ef3d7f30a50a5560e7834b43903
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/google-gdk-license"
          33b6a2b64607f11b759f320ef9dff4ae5c47d97a
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/microxr-sysimage-license"
          3a7848b1d7366ca5cfa0be477627644ca73f47e3
          EOF

          cat << 'EOF' > "$SDK_DIR/licenses/mips-android-sysimage-license"
          e9acab5b5fbb560a72cfaecce8946896ff6aab9d
          EOF

          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER" || true
            set +o pipefail
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi

      - name: Restore Debug Keystore & Env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f app/google-services.json ] && [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --no-parallel --max-workers=1 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "================ REAL GRADLE ERROR ================"
            if grep -q "FAILURE: Build failed" build.log; then
              grep -A 25 "FAILURE: Build failed" build.log | head -n 30
            else
              tail -n 30 build.log
            fi
            exit "$BUILD_EXIT"
          fi

      - name: Prepare FotoFilm APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk FotoFilm.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FotoFilm-APK
          path: FotoFilm.apk
          retention-days: 30

      - name: Create or Update Latest Release
        id: publish_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: latest
          name: "FotoFilm App Release (116 MB)"
          body: "আপনার নতুন FotoFilm অ্যান্ড্রয়েড অ্যাপের রেডি APK ফাইল (প্রায় ১১৬ MB)। নিচে Assets থেকে FotoFilm.apk ডাউনলোড করে ফোনে ইনস্টল করে নিন।"
          files: FotoFilm.apk
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          {
            echo "## FotoFilm APK Build Summary"
            if [ -f FotoFilm.apk ]; then
              echo "- APK Status: **Ready** ($(du -h FotoFilm.apk | cut -f1))"
              echo "- Download from **Artifacts -> FotoFilm-APK** below on this page."
            else
              echo "- APK Status: **Build Failed**"
              if [ -f build.log ]; then
                echo ""
                echo "### Error Details"
                echo '```text'
                if grep -q "FAILURE: Build failed" build.log; then
                  grep -A 25 "FAILURE: Build failed" build.log | head -n 30
                else
                  tail -n 30 build.log
                fi
                echo '```'
              fi
            fi
            if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
              echo "- GitHub Release: **Published** under Releases -> latest"
            elif [ "${{ steps.publish_release.outcome }}" = "failure" ]; then
              echo "- GitHub Release: **Permission blocked** (Enable Settings -> Actions -> General -> Workflow permissions -> Read and write permissions). You can still download the APK from Artifacts below."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
